# Gradle
org.gradle.jvmargs=-Xmx4G

# Project
minecraft_version=1.20.4
mod_version=1.3.13
api_version=1.3.3
maven_group=org.vivecraft
java_version=17

# Architectury Loom
enabled_platforms=fabric,forge,neoforge
loom.ignoreDependencyLoomVersionValidation=true

# library versions
lwjgl_version=3.3.2
mixin_extras_version=0.4.1
architectury_version=11.1.17
parchment_version=1.20.4:2024.04.14

# meta data
mod_id=vivecraft
mod_name=Vivecraft
mod_authors=fayer3, Ferri_Arnus, IMS, jrbudda, minecraft player, Techjar
license=LGPLv3
mod_description=The VR mod for any loader!
discord=https://discord.gg/jYyyv7zhSW
kofi=https://ko-fi.com/vivecraft
website=https://modrinth.com/mod/vivecraft
issue_tracker=https://github.com/Vivecraft/VivecraftMod/issues
sources=https://github.com/Vivecraft/VivecraftMod

# fabric props
fabric_mc_range=["1.20.3", "1.20.4"]
fabric_loader_version=0.16.14
fabric_api_version=0.97.2+1.20.4

# forge props
forge_version=1.20.4-49.1.10
forge_mc_range=[1.20.3,1.20.4]
forge_loader_range=[49,)

# neoforge props
neoforge_version=20.4.237
neoforge_mc_range=[1.20.4]
neoforge_loader_range=[20.4.70-beta,)
