# Gradle
org.gradle.jvmargs=-Xmx4G

# Project
minecraft_version=1.21.10
mod_version=1.3.9
api_version=1.3.3
maven_group=org.vivecraft
java_version=21

# Architectury Loom
enabled_platforms=fabric,forge,neoforge
loom.ignoreDependencyLoomVersionValidation=true

# library versions
lwjgl_version=3.3.3
mixin_extras_version=0.4.1
architectury_version=18.0.8
parchment_version=1.21.10:2025.10.12

# meta data
mod_id=vivecraft
mod_name=Vivecraft
mod_authors=fayer3, Ferri_Arnus, IMS, jrbudda, minecraft player, Techjar
license=LGPLv3
mod_description=The VR mod for any loader!
discord=https://discord.gg/jYyyv7zhSW
kofi=https://ko-fi.com/vivecraft
website=https://modrinth.com/mod/vivecraft
issue_tracker=https://github.com/Vivecraft/VivecraftMod/issues
sources=https://github.com/Vivecraft/VivecraftMod

# fabric props
fabric_mc_range=["1.21.9","1.21.10"]
fabric_loader_version=0.18.1
fabric_api_version=0.138.4+1.21.10

# forge props
forge_version=1.21.10-60.0.5
forge_mc_range=[1.21.9,1.21.10]
forge_loader_range=[59.0.0,60.0.12],[60.0.15,)

# neoforge props
neoforge_version=21.10.45-beta
neoforge_mc_range=[1.21.10]
neoforge_loader_range=[21.10.24-beta,)
