fabric_api_version=0.100.8+1.20.6

# forge props
forge_version=1.20.6-50.1.31
forge_mc_range=[1.20.6]
forge_loader_range=[50.0.20,)

# neoforge props
neoforge_version=20.6.122
neoforge_mc_range=[1.20.5,1.20.6]
neoforge_loader_range=[20.5.14-beta,)
