# Gradle
org.gradle.jvmargs=-Xmx4G

# Project
minecraft_version=1.21.3
mod_version=1.3.8
api_version=1.3.3
maven_group=org.vivecraft
java_version=21

# Architectury Loom
enabled_platforms=fabric,forge,neoforge
loom.ignoreDependencyLoomVersionValidation=true

# library versions
lwjgl_version=3.3.3
mixin_extras_version=0.4.1
architectury_version=14.0.4
parchment_version=1.21.3:2024.12.07

# meta data
mod_id=vivecraft
mod_name=Vivecraft
mod_authors=fayer3, Ferri_Arnus, IMS, jrbudda, minecraft player, Techjar
license=LGPLv3
mod_description=The VR mod for any loader!
discord=https://discord.gg/jYyyv7zhSW
kofi=https://ko-fi.com/vivecraft
website=https://modrinth.com/mod/vivecraft
issue_tracker=https://github.com/Vivecraft/VivecraftMod/issues
sources=https://github.com/Vivecraft/VivecraftMod

# fabric props
fabric_mc_range=["1.21.2", "1.21.3"]
fabric_loader_version=0.16.14
fabric_api_version=0.112.1+1.21.3

# forge props
forge_version=1.21.3-53.0.33
forge_mc_range=[1.21.2,1.21.3]
forge_loader_range=[53.0.0,)

# neoforge props
neoforge_version=21.3.58
neoforge_mc_range=[1.21.2,1.21.3]
neoforge_loader_range=[21.2.0-beta,)
